name: Relevé des actus

on:
  schedule:
    - cron: "15 4 * * 1-5"   # 6 h 15 à Paris en été, 5 h 15 en hiver, du lundi au vendredi : avant l'envoi du digest de 7 h
  workflow_dispatch:
    inputs:
      debug:
        description: "Afficher le détail de chaque source"
        type: boolean
        default: false
      preview_at:
        description: "Aperçu du digest pour une date (ex. 2026-11-05T05:20:00Z)"
        type: string
        default: ""
      preview_only:
        description: "Aperçu seul, sans relever les sites"
        type: boolean
        default: false
      preview_fresh:
        description: "Aperçu : contenus à marquer comme nouveaux (identifiants séparés par des virgules)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tester la lecture des dates
        run: npm test
      - name: Relever les sites
        run: npm run collect
        env:
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          PREVIEW_AT: ${{ inputs.preview_at }}
          PREVIEW_ONLY: ${{ inputs.preview_only && '1' || '0' }}
          PREVIEW_FRESH: ${{ inputs.preview_fresh }}
      - name: Enregistrer les nouveautés
        run: |
          git config user.name "actus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Relevé du $(date -u +%Y-%m-%d)"
          git push
      - name: Publier le diagnostic (mode détaillé seulement)
        if: ${{ inputs.debug }}
        run: |
          git checkout --orphan diagnostic
          git rm -rq --cached .
          git add -f debug data/articles.json
          git commit -qm "Diagnostic du $(date -u +%Y-%m-%dT%H:%M)"
          git push -f origin diagnostic
