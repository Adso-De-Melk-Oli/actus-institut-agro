name: Application Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Tests et captures d'écran
        id: tests
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:recordPaparazziDebug 2>&1 | tee ../build-tests.log
      - name: Construire l'application
        id: apk
        run: |
          set -o pipefail
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then task=assembleRelease; else task=assembleDebug; fi
          echo "Tâche : $task"
          gradle --no-daemon --stacktrace :app:$task 2>&1 | tee ../build-apk.log
          mkdir -p ../out && cp app/build/outputs/apk/*/*.apk ../out/ 2>/dev/null; ls -la ../out
      - name: Publier les résultats de compilation (branche android-build)
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/res && cp -f build-*.log /tmp/res/ 2>/dev/null || true
          cp -r android/app/src/test/snapshots/images /tmp/res/captures 2>/dev/null || true
          cp -f out/*.apk /tmp/res/ 2>/dev/null || true
          for f in android/app/build/reports/tests/testDebugUnitTest/index.html; do [ -f "$f" ] && cp "$f" /tmp/res/rapport-tests.html; done
          echo "${{ steps.tests.outcome }} / ${{ steps.apk.outcome }} — $(date -u +%FT%TZ) — ${GITHUB_SHA::7}" > /tmp/res/STATUT.txt
          git config user.name "actus-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan android-build && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/res/. . && git add -A . && git commit -qm "Compilation Android ${GITHUB_SHA::7}" && git push -fq origin android-build
      - name: Publier l'APK (release « android »)
        if: ${{ success() && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*-release.apk ActusInstitutAgro.apk
          notes="Version $(date -u +%F) — installer ActusInstitutAgro.apk sur le téléphone (Android 8 et plus)."
          gh release view android >/dev/null 2>&1 || gh release create android --title "Application Android" --notes "$notes" --target main
          gh release edit android --notes "$notes"
          gh release upload android ActusInstitutAgro.apk --clobber
